services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__SlotGuard: "Host=db;Database=slotguard;Username=slotguard;Password=slotguard_dev"
      DataProtection__KeyDirectory: /keys
      Waitlist__HoldSeconds: "${SLOTGUARD_HOLD_SECONDS:-600}"
      DemoAccounts__Password: "${SLOTGUARD_DEMO_PASSWORD-slotguard_demo}"
      RabbitMq__Uri: "amqp://slotguard:slotguard_dev@rabbitmq:5672/%2F"
      Mail__Host: "${SLOTGUARD_MAIL_HOST:-mailpit}"
      Mail__Port: "${SLOTGUARD_MAIL_PORT:-1025}"
      Mail__StartTls: "${SLOTGUARD_MAIL_STARTTLS:-false}"
      Mail__From: "${SLOTGUARD_MAIL_FROM:-slotguard@localhost}"
      Mail__User: "${SLOTGUARD_MAIL_USER:-}"
      Mail__Password: "${SLOTGUARD_MAIL_PASSWORD:-}"
      Mail__PublicUrl: "${SLOTGUARD_PUBLIC_URL:-http://127.0.0.1:8080/}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_keys:/keys

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: slotguard
      POSTGRES_USER: slotguard
      POSTGRES_PASSWORD: slotguard_dev
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "slotguard", "-d", "slotguard"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.4-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: slotguard
      RABBITMQ_DEFAULT_PASS: slotguard_dev
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  app_keys:
  postgres_data:
  rabbitmq_data:
