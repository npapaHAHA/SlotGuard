services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__SlotGuard: "Host=db;Database=slotguard;Username=slotguard;Password=slotguard_dev"
      DataProtection__KeyDirectory: /keys
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_keys:/keys

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: slotguard
      POSTGRES_USER: slotguard
      POSTGRES_PASSWORD: slotguard_dev
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "slotguard", "-d", "slotguard"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  app_keys:
  postgres_data:
