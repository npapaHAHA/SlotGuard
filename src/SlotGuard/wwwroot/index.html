<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>SlotGuard — календарь бронирования</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <div class="brand"><span class="brand-icon" aria-hidden="true"><span></span></span>SlotGuard</div>
      <span class="guest" id="guest" hidden></span>
    </div>
  </header>
  <main class="shell">
    <h1>Бронирование ресурсов</h1>
    <p class="intro">Выберите оборудование или помещение и найдите свободное время.</p>

    <div id="notice" class="notice" role="alert" hidden></div>
    <section class="resources-section" aria-labelledby="resources-title">
      <h2 id="resources-title">Ресурсы</h2>
      <div id="resources" class="resources"></div>
    </section>

    <div class="workspace">
      <section class="panel calendar" aria-labelledby="calendar-title">
        <div class="calendar-header">
          <div>
            <h2 id="calendar-title">Календарь</h2>
            <p id="week-label" class="week-label" aria-live="polite">Загрузка…</p>
          </div>
          <div class="week-controls" aria-label="Переключение недель">
            <button type="button" class="icon-button" id="prev" aria-label="Предыдущая неделя" disabled>‹</button>
            <button type="button" class="icon-button today-button" id="today" disabled>Сегодня</button>
            <button type="button" class="icon-button" id="next" aria-label="Следующая неделя" disabled>›</button>
          </div>
        </div>
        <div class="calendar-scroll" tabindex="0" role="region" aria-label="Слоты по дням недели">
          <div id="week" class="week"></div>
        </div>
        <div class="calendar-footer">
          <ul class="legend" aria-label="Статусы слотов">
            <li><span class="dot available"></span>Свободно</li>
            <li><span class="dot booked"></span>Занято</li>
            <li><span class="dot mine"></span>Моя бронь</li>
          </ul>
          <span class="timezone">МСК · UTC+3</span>
        </div>
      </section>

      <aside class="panel details" aria-labelledby="details-title">
        <h2 id="details-title">Выбранный слот</h2>
        <div id="details"></div>
        <section id="race-panel" class="race-panel" aria-labelledby="race-title" hidden>
          <h3 id="race-title">Проверка конкуренции</h3>
          <p>Отправьте 20 одновременных запросов на этот слот.</p>
          <button type="button" id="race-button" class="button secondary">Запустить 20 запросов</button>
          <div id="race-result" class="race-result" role="status"></div>
        </section>
      </aside>
    </div>
    <div id="status" class="sr-only" role="status"></div>
  </main>
</body>
</html>
